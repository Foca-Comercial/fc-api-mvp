databases:
  - name: fc-db
    plan: free
    databaseName: fc_db
    user: fc_user

services:
  - type: web
    name: fc-api
    runtime: python
    branch: demo
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.db.seeds && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: fc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax

  - type: web
    name: fc-web
    runtime: static
    branch: demo
    repo: https://github.com/Foca-Comercial/fc-web-mvp
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/fc-web-mvp/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fc-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html